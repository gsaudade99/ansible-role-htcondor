---
- hosts: localhost
  gather_facts: false
  tasks:
    - name: Read RedHat task file
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../tasks/RedHat.yaml"
      register: redhat_tasks_file

    - name: Verify RedHat key management implementation
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.rpm_key' not in redhat_tasks_file.content | b64decode"
          - "'Download EPEL GPG key' in redhat_tasks_file.content | b64decode"
          - "'cmd: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-EPEL-' in redhat_tasks_file.content | b64decode"
          - "'Download HTCondor GPG key' in redhat_tasks_file.content | b64decode"
          - "'cmd: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-HTCondor-' in redhat_tasks_file.content | b64decode"
